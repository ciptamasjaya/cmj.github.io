# SEO Settings
lang: id
timezone: Asia/Jakarta
keywords: "riksa uji k3, jasa riksa uji, inspeksi k3, sertifikasi k3, pesawat angkat, bejana tekan, instalasi listrik, proteksi kebakaran, elevator"

# Build Settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# SCSS/Sass Settings
sass:
  sass_dir: assets/css
  style: compressed
  sourcemap: never
  load_paths:
    - _sass
    - assets/css

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-last-modified-at

# Pagination Settings
pagination:
  enabled: true
  per_page: 9
  permalink: '/blog/page/:num/'
  title: ':title - Halaman :num'
  sort_field: 'date'
  sort_reverse: true
  trail:
    before: 2
    after: 2

# HTML Compression
# Uses jekyll-compress-html v3.0.1
# https://github.com/penibelst/jekyll-compress-html
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
  ignore:
    envs: [development]

# Collections
collections:
  services:
    output: true
    permalink: /layanan/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "node--post"
      author: "Admin"
  - scope:
      path: ""
      type: "services"
    values:
      layout: "node--service"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md
  - LICENSE
  - RELEASE/
  - TEMPLATES/
  - TODO/
  - RELEASE_NOTES.md
  - CHANGELOG.md
  - COMPONENTS.md
  - SCSS-GUIDE.md
  - STRUKTUR-PROJECT.md
  - rebuild.sh
