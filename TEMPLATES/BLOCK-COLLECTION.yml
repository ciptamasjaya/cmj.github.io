# ============================================================================
# BLOCK COLLECTION - Component Registry
# ============================================================================
#
# @file        TEMPLATES/BLOCK-COLLECTION.yml
# @description Central registry untuk semua block components. File ini berisi
#              metadata dan struktur heading dari setiap block component yang
#              tersedia. Digunakan untuk memilih block yang sesuai tanpa
#              perlu scan semua files.
#
# @version     1.0.0
# @date        2025-11-22
# @author      arisciwek (PT. Cipta Mas Jaya)
#
# WAJIB: Setiap block baru harus didaftarkan di file ini!
#
# ============================================================================

blocks:
  - id: h2-with-3-cards
    file: reusable-blocks/block--h2-with-3-cards.html
    name: "H2 Section with 3 Cards"
    category: general
    tags:
      - general-purpose
      - features
      - benefits
      - services
      - 3-column
      - flexible
    use_cases:
      - service_showcase
      - company_benefits
      - features_showcase
      - benefits_list
      - general
      - k3_services
    description: |
      Block umum dengan H2 heading, 1 intro paragraph, dan 3 cards dengan icon.
      Setiap card berisi H3 title dan 2 paragraphs. Layout 3-column responsive.
      Sangat flexible untuk berbagai use case: jasa K3, keunggulan perusahaan, atau informasi umum.
      Block ini menggunakan explicit frontmatter (no loops) untuk kontrol penuh setiap card.
      Cocok untuk showcase layanan riksa uji K3, sertifikasi, dan keunggulan perusahaan.

    heading_structure:
      h2: 1  # Main section title (heading_2_title)
      h3: 3  # Card titles (heading_3_title_1, heading_3_title_2, heading_3_title_3)
      h4: 0
      h5: 0
      h6: 0
      total: 4

    frontmatter_variables:
      section_name: "section_h2_with_3_cards"
      required_fields:
        - heading_2_title
        - intro_paragraph
        - heading_3_title_1
        - icon_name_1
        - icon_size_1
        - icon_color_1
        - paragraph_1_1
        - paragraph_2_1
        - heading_3_title_2
        - icon_name_2
        - icon_size_2
        - icon_color_2
        - paragraph_1_2
        - paragraph_2_2
        - heading_3_title_3
        - icon_name_3
        - icon_size_3
        - icon_color_3
        - paragraph_1_3
        - paragraph_2_3

    component_dependencies:
      - components/card.html

    css_classes:
      - block--h2-with-3-cards
      - block__header
      - block__card
      - block__card-1
      - block__card-2
      - block__card-3
      - heading-2-title
      - intro-paragraph
      - heading-3-title-1
      - heading-3-title-2
      - heading-3-title-3
      - paragraph-1-1
      - paragraph-2-1
      - paragraph-1-2
      - paragraph-2-2
      - paragraph-1-3
      - paragraph-2-3

  - id: h2-with-3-cards-detailed
    file: reusable-blocks/block--h2-with-3-cards-detailed.html
    name: "H2 Section with 3 Detailed Cards"
    category: general
    tags:
      - general-purpose
      - detailed
      - features
      - benefits
      - services
      - 3-column
      - h4-subsections
    use_cases:
      - detailed_service_showcase
      - comprehensive_features
      - detailed_benefits
      - structured_information
      - k3_services_detailed
    description: |
      Block dengan H2 heading, 2 intro paragraphs, dan 3 detailed cards.
      Setiap card berisi icon, H3 title, 1 intro paragraph, dan 3 H4 sub-sections dengan icon.
      Layout 3-column responsive dengan struktur heading yang lebih kompleks (13 total headings).
      Cocok untuk showcase layanan K3 yang membutuhkan detail lebih lengkap dengan sub-kategori.

    heading_structure:
      h2: 1  # Main section title
      h3: 3  # Card titles
      h4: 9  # 3 H4 per card × 3 cards
      h5: 0
      h6: 0
      total: 13

    frontmatter_variables:
      section_name: "section_h2_with_3_cards_detailed"
      required_fields:
