  - id: carousel
    file: components/carousel.html
    name: "Carousel Component"
    category: ui-component
    type: component
    tags:
      - bootstrap5
      - carousel
      - slider
      - gallery
      - images
      - webp
    use_cases:
      - image_gallery
      - product_showcase
      - service_gallery
      - hero_slider
      - portfolio
    description: |
      Bootstrap 5 carousel/image slider dengan WebP optimization, lazy loading,
      dan caption support. Support simple image arrays atau objects dengan captions.
      Auto-play, fade transition, responsive design, dan prev/next controls.
      Cocok untuk image galleries, product showcases, atau hero sliders.

    features:
      - Bootstrap 5 carousel dengan slide animation
      - WebP optimization dengan picture element
      - Lazy loading (kecuali first image)
      - Responsive design dengan object-fit
      - Carousel indicators untuk navigation
      - Previous/Next controls
      - Caption support per slide
      - Auto-play option
      - Fade transition option

    parameters:
      - name: carousel_id
        type: string
        required: true
        description: "Unique ID untuk carousel element"
        example: "craneGallery"

      - name: images
        type: array
        required: true
        description: "Array of image paths OR objects with image and caption"
        example: |
          Simple: ["/assets/img1.jpg", "/assets/img2.jpg"]
          With captions: [
            {"image": "/assets/img1.jpg", "caption": "Caption 1", "title": "Title 1"},
            {"image": "/assets/img2.jpg", "caption": "Caption 2"}
          ]

      - name: title
        type: string
        required: true
        description: "Default title untuk alt text"

      - name: max_height
        type: string
        required: false
        default: "500px"
        description: "Max height untuk images"

      - name: autoplay
        type: boolean
        required: false
        default: false
        description: "Enable auto-play"

      - name: interval
        type: number
        required: false
        default: 5000
        description: "Auto-play interval dalam ms"

      - name: controls
        type: boolean
        required: false
        default: true
        description: "Show prev/next controls"

      - name: indicators
        type: boolean
        required: false
        default: true
        description: "Show slide indicators"

      - name: fade
        type: boolean
        required: false
        default: false
        description: "Use fade transition instead of slide"

    css_classes:
      - carousel
      - carousel-fade
      - carousel-inner
      - carousel-item
      - carousel-indicators
      - carousel-control-prev
      - carousel-control-next
      - carousel-caption

    dependencies:
      - Bootstrap 5

    usage_examples:
      - name: "Simple image carousel"
        code: |
          {% assign gallery = "/assets/images/1.jpg,/assets/images/2.jpg" | split: "," %}
          {% include components/carousel.html
             carousel_id="craneGallery"
             images=gallery
             title="Riksa Uji Crane"
          %}

      - name: "Carousel with captions and autoplay"
        code: |
          {% capture slides %}
          [
            {
              "image": "/assets/images/service-1.jpg",
              "title": "Riksa Uji Crane",
              "caption": "Pemeriksaan menyeluruh alat angkat"
            },
            {
              "image": "/assets/images/service-2.jpg",
              "title": "Riksa Uji Boiler",
              "caption": "Inspeksi bejana tekan"
            }
          ]
          {% endcapture %}

          {% include components/carousel.html
             carousel_id="servicesCarousel"
             images=slides
             title="Layanan Riksa Uji K3"
             autoplay=true
             interval=3000
          %}

