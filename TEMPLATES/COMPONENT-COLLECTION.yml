# ============================================================================
# COMPONENT COLLECTION - Component Registry
# ============================================================================
#
# @file        TEMPLATES/COMPONENT-COLLECTION.yml
# @description Central registry untuk semua UI components. File ini berisi
#              metadata, parameters, dan dokumentasi dari setiap component
#              yang tersedia. Digunakan untuk referensi cepat parameter dan
#              opsi styling tanpa perlu membuka file component.
#
# @version     1.0.0
# @date        2025-11-22
# @author      arisciwek (PT. Cipta Mas Jaya)
#
# WAJIB: Setiap component baru harus didaftarkan di file ini!
#
# ============================================================================

components:
  - id: card
    file: components/card.html
    name: "Card Component"
    category: ui-component
    type: component
    tags:
      - bootstrap5
      - card
      - reusable
      - flexible
      - responsive
    use_cases:
      - service_showcase
      - feature_display
      - content_container
      - product_card
      - info_card
    description: |
      Bootstrap 5 card component yang sangat fleksibel dengan berbagai opsi kustomisasi.
      Support untuk image (top/bottom), icon, header, body, footer, badge, link/button,
      hover effects, dan berbagai styling options. Cocok untuk berbagai use case:
      service cards, feature cards, product cards, atau content containers.

    features:
      - Bootstrap 5 card dengan customizable content
      - Support image positioning (top/bottom)
      - Icon support dengan berbagai ukuran dan warna
      - Badge support untuk labels
      - Link/button dalam footer
      - Hover effects (optional)
      - Border dan shadow customization
      - Responsive layout
      - Text alignment options

    parameters:
      # Image Options
      - name: image
        type: string
        required: false
        description: "URL gambar untuk card (optional)"
        example: "/assets/images/service-crane.jpg"

      - name: image_position
        type: string
        required: false
        default: "top"
        options:
          - top
          - bottom
        description: "Posisi gambar di card"

      - name: image_alt
        type: string
        required: false
        default: "value dari title parameter"
        description: "Alt text untuk gambar"

      # Icon Options
      - name: icon
        type: string
        required: false
        description: "Bootstrap icon class (tanpa prefix 'bi')"
        example: "bi-shield-check"
        common_icons:
          - bi-award
          - bi-shield-check
          - bi-lightning
          - bi-heart
          - bi-star
          - bi-trophy
          - bi-badge-check
          - bi-check-circle
          - bi-gear
          - bi-tools
          - bi-people

      - name: icon_size
        type: string
        required: false
        default: "lg"
        options:
          - sm: "1rem (16px)"
          - md: "1.5rem (24px)"
          - lg: "2rem (32px)"
          - xl: "2.5rem (40px)"
          - 2xl: "3rem (48px)"
        description: "Ukuran icon"

      - name: icon_color
        type: string
        required: false
        default: "text-primary"
        options:
          - text-primary
          - text-secondary
          - text-success
          - text-danger
          - text-warning
          - text-info
          - text-dark
          - text-wood
        description: "Bootstrap text color utility class untuk icon"

      # Content Options
      - name: title
        type: string
        required: false
        description: "Judul card (H5 heading)"

      - name: subtitle
        type: string
        required: false
        description: "Subjudul card (H6 heading)"

      - name: content
        type: string
        required: true
        description: "Konten utama card body (bisa HTML)"
        example: "<p>Isi konten card di sini</p>"

      - name: footer
        type: string
        required: false
        description: "Konten footer card (optional)"

      # Badge Options
      - name: badge
        type: string
        required: false
        description: "Text untuk badge label"
        example: "Populer"

      - name: badge_color
        type: string
        required: false
        default: "bg-primary"
        options:
          - bg-primary
          - bg-secondary
          - bg-success
          - bg-danger
          - bg-warning
          - bg-info
          - bg-wood
        description: "Background class untuk badge"

      # Link Options
      - name: link_url
        type: string
        required: false
        description: "URL untuk link/button di card body"

      - name: link_text
        type: string
        required: false
        default: "Selengkapnya"
        description: "Text untuk link/button"

      # Styling Options
      - name: hover_effect
        type: boolean
        required: false
        default: true
        description: "Enable/disable hover transform effect"

      - name: border
        type: string
        required: false
        description: "Border class untuk card"
        example: "border-primary"
        options:
          - border-primary
          - border-secondary
          - border-success
          - border-danger
          - border-warning
          - border-info

      - name: shadow
        type: string
        required: false
        default: "shadow-sm"
        options:
          - shadow-sm
          - shadow
          - shadow-lg
        description: "Shadow class untuk card"

      - name: text_center
        type: boolean
        required: false
        default: false
        description: "Center align text dalam card"

    css_classes:
      - component-card
      - component-card--hover
      - component-card__image
      - component-card__image--top
      - component-card__image--bottom
      - component-card__header
      - component-card__badge
      - component-card__icon-wrapper
      - component-card__icon
      - component-card__icon--sm
      - component-card__icon--md
      - component-card__icon--lg
      - component-card__icon--xl
      - component-card__icon--2xl
      - component-card__body
      - component-card__title
      - component-card__subtitle
      - component-card__content
      - component-card__link
      - component-card__footer

    dependencies:
      - Bootstrap 5
      - Bootstrap Icons

    usage_examples:
      - name: "Simple card with icon"
        code: |
          {% include components/card.html
             icon="bi-shield-check"
             icon_size="xl"
             icon_color="text-primary"
             title="Jasa Riksa Uji K3"
             content="<p>Layanan riksa uji peralatan K3 terpercaya...</p>"
             hover_effect=true
          %}

      - name: "Card with image and badge"
        code: |
          {% include components/card.html
             image="/assets/images/service-crane.jpg"
             image_alt="Riksa Uji Crane"
             title="Riksa Uji Crane"
             badge="Populer"
             badge_color="bg-warning"
             content="<p>Pemeriksaan dan pengujian crane...</p>"
             link_url="/layanan/riksa-uji-crane"
             link_text="Lihat Detail"
             shadow="shadow-lg"
          %}

      - name: "Card with custom styling"
        code: |
          {% include components/card.html
             icon="bi-check-circle"
             icon_size="2xl"
             icon_color="text-success"
             title="Sertifikat Resmi"
             content="<p>Mendapatkan sertifikat resmi...</p>"
             shadow="shadow-lg"
             border="border-success"
             text_center=true
             hover_effect=false
          %}

      - name: "Card with captured content (for complex content)"
        code: |
          {% capture card_content %}
            <p>Paragraf pertama</p>
            <p>Paragraf kedua</p>
            <ul>
              <li>Item 1</li>
              <li>Item 2</li>
            </ul>
          {% endcapture %}

          {% include components/card.html
             icon="bi-tools"
             title="Layanan Lengkap"
             content=card_content
          %}

  - id: accordion
    file: components/accordion.html
    name: "Accordion Component"
    category: ui-component
    type: component
    tags:
      - bootstrap5
      - accordion
      - collapse
      - faq
      - expandable
      - responsive
    use_cases:
      - faq_section
      - collapsible_content
      - structured_information
      - nested_content
      - documentation
    description: |
      Bootstrap 5 accordion component dengan collapse functionality untuk menampilkan
      konten yang dapat di-expand/collapse. Support multiple items, icon pada setiap item,
      auto-collapse atau allow multiple open items, dan flush style. Cocok untuk FAQ,
      dokumentasi, atau konten terstruktur yang perlu ditampilkan secara bertahap.

    features:
      - Bootstrap 5 accordion dengan collapse functionality
      - Support multiple items dalam satu accordion
      - Icon support untuk setiap item
      - Auto-collapse atau allow multiple open items
      - Flush style (removes border dan rounded corners)
      - Nested accordion support
      - Customizable expanded state per item
      - Responsive design

    parameters:
      - name: accordion_id
        type: string
        required: true
        description: "Unique ID untuk accordion element"
        example: "faqAccordion"

      - name: items
        type: array
        required: true
        description: "Array of accordion items (JSON format)"
        structure:
          - title: "Item title/heading"
          - content: "Item content (HTML)"
          - icon: "bi-icon-name (optional)"
          - expanded: "true/false (optional, default: false)"
        example: |
          [
            {
              "title": "Apa itu Riksa Uji K3?",
              "content": "<p>Riksa uji K3 adalah...</p>",
              "icon": "bi-question-circle",
              "expanded": true
            }
          ]

      - name: flush
        type: boolean
        required: false
        default: false
        description: "Remove border dan rounded corners"

      - name: allow_multiple
        type: boolean
        required: false
        default: false
        description: "Allow multiple items to be open (disable auto-collapse)"

      - name: parent_id
        type: string
        required: false
        description: "Parent accordion ID untuk nested accordions"

    css_classes:
      - accordion
      - accordion-flush
      - accordion-item
      - accordion-header
      - accordion-button
      - accordion-collapse
      - accordion-body

    dependencies:
      - Bootstrap 5
      - Bootstrap Icons

    usage_examples:
      - name: "Basic FAQ accordion"
        code: |
          {% capture items %}
          [
            {
              "title": "Apa itu Riksa Uji K3?",
              "content": "<p>Riksa uji K3 adalah pemeriksaan...</p>",
              "icon": "bi-question-circle",
              "expanded": true
            },
            {
              "title": "Berapa lama proses riksa uji?",
              "content": "<p>Proses riksa uji biasanya 1-3 hari...</p>",
              "icon": "bi-clock"
            }
          ]
          {% endcapture %}

          {% include components/accordion.html
             accordion_id="faqAccordion"
             items=items
          %}

      - name: "Flush accordion (borderless)"
        code: |
          {% include components/accordion.html
             accordion_id="flushAccordion"
             items=items
             flush=true
          %}

      - name: "Allow multiple items open"
        code: |
          {% include components/accordion.html
             accordion_id="multiAccordion"
             items=items
             allow_multiple=true
          %}

  - id: alert
    file: components/alert.html
    name: "Alert Component"
    category: ui-component
    type: component
    tags:
      - bootstrap5
      - alert
      - notification
      - message
      - dismissible
      - responsive
    use_cases:
      - success_message
      - error_message
      - warning_notice
      - info_banner
      - notification
    description: |
      Bootstrap 5 alert component yang fleksibel untuk menampilkan berbagai jenis pesan:
      success, error, warning, info, dll. Support icon, heading, dismissible dengan close button,
      berbagai border styles, custom colors, dan fade animation. Cocok untuk feedback messages,
      notifications, atau informasi penting yang perlu ditampilkan ke user.

    features:
      - Bootstrap 5 alert variants (8 variants)
      - Dismissible dengan close button
      - Icon support (customizable size dan position)
      - Optional heading
      - Link styling support
      - Border variants (solid, left-accent, none)
      - Custom background dan text colors
      - Fade animation
      - Customizable classes dan attributes

    parameters:
      - name: content
        type: string
        required: true
        description: "Alert content/message (dapat berisi HTML)"
        example: "This is a basic alert message."

      - name: variant
        type: string
        required: false
        default: "info"
        options:
          - primary
          - secondary
          - success
          - danger
          - warning
          - info
          - light
          - dark
        description: "Bootstrap alert variant"

      - name: heading
        type: string
        required: false
        description: "Alert heading/title (optional)"

      - name: icon
        type: string
        required: false
        description: "Bootstrap icon class"
        example: "bi-info-circle-fill"

      - name: icon_size
        type: string
        required: false
        default: "lg"
        options:
          - sm
          - md
          - lg
          - xl
        description: "Icon size"

      - name: icon_position
        type: string
        required: false
        default: "left"
        options:
          - left
          - top
        description: "Icon position"

      - name: dismissible
        type: boolean
        required: false
        default: false
        description: "Add close button"

      - name: fade
        type: boolean
        required: false
        default: true
        description: "Fade animation"

      - name: border_style
        type: string
        required: false
        default: "default"
        options:
          - default
          - left-accent
          - none
        description: "Border style variant"

      - name: bg_color
        type: string
        required: false
        description: "Custom background color class"
        example: "bg-wood"

      - name: text_color
        type: string
        required: false
        description: "Custom text color class"
        example: "text-white"

      - name: additional_classes
        type: string
        required: false
        description: "Extra CSS classes"

      - name: id
        type: string
        required: false
        description: "Alert ID attribute"

    css_classes:
      - component-alert
      - component-alert--border-default
      - component-alert--border-left-accent
      - component-alert--border-none
      - component-alert--icon-left
      - component-alert--icon-top
      - component-alert__icon-wrapper
      - component-alert__icon
      - component-alert__icon--sm
      - component-alert__icon--md
      - component-alert__icon--lg
      - component-alert__icon--xl
      - component-alert__content-wrapper
      - component-alert__content
      - component-alert__heading
      - component-alert__text

    dependencies:
      - Bootstrap 5
      - Bootstrap Icons

    usage_examples:
      - name: "Success alert with icon"
        code: |
          {% include components/alert.html
             content="Your form has been submitted successfully!"
             variant="success"
             icon="bi-check-circle-fill"
          %}

      - name: "Danger alert with heading"
        code: |
          {% include components/alert.html
             heading="Error!"
             content="Something went wrong. Please try again."
             variant="danger"
             icon="bi-exclamation-triangle-fill"
          %}

      - name: "Dismissible alert"
        code: |
          {% include components/alert.html
             content="This alert can be closed."
             variant="primary"
             dismissible=true
          %}

      - name: "Alert with left accent border"
        code: |
          {% include components/alert.html
             content="Important information with accent."
             variant="info"
             icon="bi-info-circle-fill"
             border_style="left-accent"
          %}

  - id: badge
    file: components/badge.html
    name: "Badge Component"
    category: ui-component
    type: component
    tags:
      - bootstrap5
      - badge
      - label
      - tag
      - pill
      - notification
    use_cases:
      - status_indicator
      - label
      - counter
      - notification_badge
      - tag
    description: |
      Bootstrap 5 badge component yang sangat fleksibel untuk labels, tags, counters,
      atau status indicators. Support pill shape, icon (left/right), berbagai ukuran,
      positioned badges (untuk notification counter), link badges, dan custom colors.
      Cocok untuk status, labels, notification counters, atau tags.

    features:
      - Bootstrap 5 badge variants (8 variants)
      - Pill shape option (rounded badges)
      - Icon support (left atau right position)
      - Size variants (sm, md, lg, xl)
      - Position variants (untuk badges on buttons/headings)
      - Custom background dan text colors
      - Notification badge dengan counter
      - Link badge option
      - Customizable classes dan attributes

    parameters:
      - name: text
        type: string
        required: true
        description: "Badge text/label"
        example: "New"

      - name: variant
        type: string
        required: false
        default: "primary"
        options:
          - primary
          - secondary
          - success
          - danger
          - warning
          - info
          - light
          - dark
        description: "Bootstrap badge variant"

      - name: pill
        type: boolean
        required: false
        default: false
        description: "Rounded pill shape"

      - name: icon
        type: string
        required: false
        description: "Bootstrap icon class"
        example: "bi-check-circle"

      - name: icon_position
        type: string
        required: false
        default: "left"
        options:
          - left
          - right
        description: "Icon position"

      - name: icon_size
        type: string
        required: false
        default: "sm"
        options:
          - sm
          - md
          - lg
        description: "Icon size"

      - name: size
        type: string
        required: false
        default: "md"
        options:
          - sm: "0.65rem font, 0.35rem padding"
          - md: "0.75rem font, 0.5rem padding"
          - lg: "0.875rem font, 0.6rem padding"
          - xl: "1rem font, 0.75rem padding"
        description: "Badge size"

      - name: position
        type: string
        required: false
        options:
          - top-right
          - top-left
          - bottom-right
          - bottom-left
        description: "Position for notification badges"

      - name: bg_color
        type: string
        required: false
        description: "Custom background color class"
        example: "bg-wood"

      - name: text_color
        type: string
        required: false
        description: "Custom text color class"
        example: "text-white"

      - name: href
        type: string
        required: false
        description: "URL for link badge"

      - name: target
        type: string
        required: false
        options:
          - _blank
          - _self
        description: "Link target (for link badges)"

      - name: additional_classes
        type: string
        required: false
        description: "Extra CSS classes"

      - name: id
        type: string
        required: false
        description: "Badge ID attribute"

    css_classes:
      - component-badge
      - component-badge--sm
      - component-badge--md
      - component-badge--lg
      - component-badge--xl
      - component-badge--top-right
      - component-badge--top-left
      - component-badge--bottom-right
      - component-badge--bottom-left
      - component-badge__icon
      - component-badge__icon--sm
      - component-badge__icon--md
      - component-badge__icon--lg
      - component-badge__text

    dependencies:
      - Bootstrap 5
      - Bootstrap Icons

    usage_examples:
      - name: "Basic pill badge"
        code: |
          {% include components/badge.html
             text="Featured"
             variant="success"
             pill=true
          %}

      - name: "Badge with icon"
        code: |
          {% include components/badge.html
             text="Verified"
             variant="success"
             icon="bi-check-circle-fill"
          %}

      - name: "Notification badge on button"
        code: |
          <button class="btn btn-primary position-relative">
            Notifications
            {% include components/badge.html
               text="4"
               variant="danger"
               pill=true
               position="top-right"
            %}
          </button>

      - name: "Link badge"
        code: |
          {% include components/badge.html
             text="Visit Documentation"
             variant="primary"
             href="/docs"
             icon="bi-book"
          %}

  - id: button
    file: components/button.html
    name: "Button Component"
    category: ui-component
    type: component
    tags:
      - bootstrap5
      - button
      - cta
      - action
      - link
      - responsive
    use_cases:
      - call_to_action
      - form_submit
      - navigation_link
      - modal_trigger
      - action_button
    description: |
      Bootstrap 5 button component yang sangat fleksibel dengan berbagai variants,
      sizes, dan styling options. Support outline variants, icon (left/right),
      block button, disabled state, dan dapat render sebagai button atau link element.
      Cocok untuk CTA, form submit, navigation, modal triggers, atau action buttons.

    features:
      - Bootstrap 5 button variants (9 variants)
      - Outline variants untuk semua colors
      - Size variants (sm, md, lg)
      - Block button option (full-width)
      - Disabled state support
      - Icon support (left atau right position)
      - Icon size presets (5 sizes)
      - Render sebagai button atau link
      - Data attributes support (modal, collapse, dll)
      - Customizable classes dan attributes

    parameters:
      - name: text
        type: string
        required: true
        description: "Button text/label"
        example: "Hubungi Kami"

      - name: variant
        type: string
        required: false
        default: "primary"
        options:
          - primary
          - secondary
          - success
          - danger
          - warning
          - info
          - light
          - dark
          - link
        description: "Bootstrap button variant"

      - name: outline
        type: boolean
        required: false
        default: false
        description: "Use outline variant"

      - name: size
        type: string
        required: false
        default: "md"
        options:
          - sm
          - md
          - lg
        description: "Button size"

      - name: block
        type: boolean
        required: false
        default: false
        description: "Full-width button"

      - name: disabled
        type: boolean
        required: false
        default: false
        description: "Disabled state"

      - name: type
        type: string
        required: false
        default: "button"
        options:
          - button
          - submit
          - reset
        description: "Button type (hanya untuk button element)"

      - name: href
        type: string
        required: false
        description: "URL untuk link button (render sebagai <a>)"

      - name: target
        type: string
        required: false
        options:
          - _blank
          - _self
          - _parent
          - _top
        description: "Link target (untuk link buttons)"

      - name: icon
        type: string
        required: false
        description: "Bootstrap icon class"
        example: "bi-check-circle"

      - name: icon_position
        type: string
        required: false
        default: "left"
        options:
          - left
          - right
        description: "Icon position"

      - name: icon_size
        type: string
        required: false
        default: "md"
        options:
          - sm
          - md
          - lg
          - xl
          - 2xl
        description: "Icon size"

      - name: icon_color
        type: string
        required: false
        description: "Icon color class (default: inherits button color)"

      - name: additional_classes
        type: string
        required: false
        description: "Extra CSS classes"

      - name: id
        type: string
        required: false
        description: "Button ID attribute"

      - name: data_bs_toggle
        type: string
        required: false
        description: "Bootstrap data-bs-toggle attribute"
        example: "modal"

      - name: data_bs_target
        type: string
        required: false
        description: "Bootstrap data-bs-target attribute"
        example: "#myModal"

      - name: data_bs_dismiss
        type: string
        required: false
        description: "Bootstrap data-bs-dismiss attribute"

    css_classes:
      - component-button
      - component-button__icon
      - component-button__icon--sm
      - component-button__icon--md
      - component-button__icon--lg
      - component-button__icon--xl
      - component-button__icon--2xl
      - component-button__text

    dependencies:
      - Bootstrap 5
      - Bootstrap Icons

    usage_examples:
      - name: "Primary button with icon"
        code: |
          {% include components/button.html
             text="Download Brosur"
             variant="primary"
             icon="bi-download"
          %}

      - name: "Outline button"
        code: |
          {% include components/button.html
             text="Pelajari Lebih Lanjut"
             variant="success"
             outline=true
          %}

      - name: "Link button"
        code: |
          {% include components/button.html
             text="Visit Website"
             variant="primary"
             href="https://example.com"
             target="_blank"
             icon="bi-box-arrow-up-right"
             icon_position="right"
          %}

      - name: "Large block button"
        code: |
          {% include components/button.html
             text="Minta Penawaran"
             variant="success"
             size="lg"
             block=true
          %}

      - name: "Modal trigger button"
        code: |
          {% include components/button.html
             text="Open Modal"
             variant="info"
             data_bs_toggle="modal"
             data_bs_target="#myModal"
          %}

  - id: card-h2-basic
    file: components/card--h2-basic.html
    name: "Card H2 Basic Component"
    category: ui-component
    type: component
    tags:
