# ============================================================================
# USAGE NOTES
# ============================================================================
#
# Component Categories:
# ---------------------
# - ui-component: Komponen UI umum (card, button, badge, dll)
# - layout: Komponen layout (grid, container, section, dll)
# - navigation: Komponen navigasi (navbar, breadcrumb, pagination, dll)
# - form: Komponen form (input, select, checkbox, dll)
# - heading: Komponen heading (H1-H6 dengan styling khusus)
# - media: Komponen media (image, video, gallery, dll)
# - utility: Komponen utility (separator, spacer, dll)
#
# Icon Sizes:
# -----------
# - sm: 1rem (16px) - Untuk icon kecil inline
# - md: 1.5rem (24px) - Untuk icon dalam button
# - lg: 2rem (32px) - Default, cocok untuk card
# - xl: 2.5rem (40px) - Untuk icon utama/prominent
# - 2xl: 3rem (48px) - Untuk hero icons atau emphasis
#
# Color Options:
# --------------
# Bootstrap colors:
# - text-primary / bg-primary: Biru (brand color)
# - text-secondary / bg-secondary: Abu-abu
# - text-success / bg-success: Hijau
# - text-danger / bg-danger: Merah
# - text-warning / bg-warning: Kuning
# - text-info / bg-info: Cyan
# - text-dark / bg-dark: Hitam
#
# Custom CMJ colors:
# - text-wood / bg-wood: Coklat kayu (brand color)
#
# Shadow Options:
# ---------------
# - shadow-sm: Subtle shadow untuk depth minimal
# - shadow: Medium shadow untuk card biasa
# - shadow-lg: Large shadow untuk card prominent/featured
#
# Best Practices:
# ---------------
# 1. Gunakan icon untuk visual identity setiap card
# 2. Gunakan badge untuk highlight/label penting (New, Popular, dll)
# 3. Gunakan hover_effect untuk interactive cards
# 4. Gunakan consistent shadow level untuk cards dalam satu section
# 5. Untuk content yang kompleks, gunakan {% capture %} pattern
# 6. Selalu sediakan image_alt untuk accessibility
# 7. Gunakan relative_url untuk image paths
# 8. Test responsive behavior di berbagai ukuran screen
#
# ============================================================================
