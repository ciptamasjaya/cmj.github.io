  - id: modal
    file: components/modal.html
    name: "Modal Component"
    category: ui-component
    type: component
    tags:
      - bootstrap5
      - modal
      - dialog
      - popup
      - overlay
      - form
    use_cases:
      - dialog_box
      - form_popup
      - confirmation
      - information_display
      - image_lightbox
    description: |
      Bootstrap 5 modal dengan berbagai customization options. Support 5 size variants
      (sm, md, lg, xl, fullscreen), centered/top positioning, scrollable content,
      static backdrop, header dengan icon, dan footer dengan customizable buttons.
      Cocok untuk dialogs, forms, confirmations, atau information displays.

    features:
      - Bootstrap 5 modal dengan customizable content
      - 5 size variants (sm, md, lg, xl, fullscreen)
      - Centered atau top-aligned positioning
      - Scrollable content option
      - Static backdrop option (prevent close on outside click)
      - Header dengan title dan optional icon
      - Footer dengan customizable buttons
      - Fade animation support
      - Custom classes dan attributes
      - Keyboard ESC close option

    parameters:
      - name: id
        type: string
        required: true
        description: "Modal ID (harus unique)"
        example: "basicModal"

      - name: title
        type: string
        required: true
        description: "Modal title/heading"

      - name: content
        type: string
        required: true
        description: "Modal body content (HTML)"

      - name: size
        type: string
        required: false
        default: "md"
        options:
          - sm
          - md
          - lg
          - xl
          - fullscreen
        description: "Modal size"

      - name: centered
        type: boolean
        required: false
        default: false
        description: "Vertically center modal"

      - name: scrollable
        type: boolean
        required: false
        default: false
        description: "Scrollable modal body"

      - name: static_backdrop
        type: boolean
        required: false
        default: false
        description: "Prevent close on outside click"

      - name: keyboard
        type: boolean
        required: false
        default: true
        description: "Close on ESC key"

      - name: fade
        type: boolean
        required: false
        default: true
        description: "Fade animation"

      - name: icon
        type: string
        required: false
        description: "Bootstrap icon class for header"
        example: "bi-info-circle-fill"

      - name: icon_color
        type: string
        required: false
        default: "text-primary"
        description: "Icon color class"

      - name: header_bg
        type: string
        required: false
        description: "Header background class"
        example: "bg-primary text-white"

      - name: footer_buttons
        type: string
        required: false
        description: "Footer buttons HTML"

      - name: footer_align
        type: string
        required: false
        default: "end"
        options:
          - start
          - center
          - end
          - between
        description: "Footer alignment"

      - name: show_close_button
        type: boolean
        required: false
        default: true
        description: "Show X button in header"

      - name: show_footer
        type: boolean
        required: false
        description: "Show footer section (auto-detect dari footer_buttons)"

      - name: additional_classes
        type: string
        required: false
        description: "Extra CSS classes for modal-dialog"

    css_classes:
      - component-modal
      - component-modal__header-icon
      - component-modal__body
      - component-modal__footer

    dependencies:
      - Bootstrap 5
      - Bootstrap Icons

    usage_examples:
      - name: "Basic modal"
        code: |
          {% include components/modal.html
             id="basicModal"
             title="Modal Title"
             content="<p>This is a basic modal.</p>"
          %}

          <!-- Trigger button -->
          <button type="button" class="btn btn-primary"
                  data-bs-toggle="modal" data-bs-target="#basicModal">
            Launch Modal
          </button>

      - name: "Large modal with icon"
        code: |
          {% include components/modal.html
             id="largeModal"
             title="Large Modal"
             icon="bi-info-circle-fill"
             size="lg"
             content="<p>Large modal content here.</p>"
          %}

      - name: "Centered confirmation modal"
        code: |
          {% include components/modal.html
             id="confirmModal"
             title="Confirm Action"
             size="sm"
             centered=true
             content="<p>Are you sure?</p>"
             footer_buttons='<button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                             <button class="btn btn-primary">Confirm</button>'
          %}

