header:
  title: "Komitmen Kami"
  icon: "bi-hand-thumbs-up"
  icon_color: "text-success"
  description: "Kami berkomitmen memberikan layanan terbaik untuk keselamatan dan keamanan perusahaan Anda"

items:
  - title: "Kualitas Terjamin"
    description: "Layanan berkualitas dengan standar internasional dan sertifikasi resmi"
    icon: "bi-award"
    icon_color: "text-primary"

  - title: "Profesionalisme"
    description: "Tim inspector bersertifikat dan berpengalaman di bidang K3"
    icon: "bi-people"
    icon_color: "text-success"

  - title: "Transparansi"
    description: "Laporan lengkap dan jelas dengan dokumentasi foto serta rekomendasi"
    icon: "bi-eye"
    icon_color: "text-info"

  - title: "Integritas"
    description: "Berpegang pada etika profesional dan peraturan yang berlaku"
    icon: "bi-shield-check"
    icon_color: "text-warning"

  - title: "Keamanan Data"
    description: "Menjaga kerahasiaan data dan informasi perusahaan klien"
    icon: "bi-lock"
    icon_color: "text-danger"

  - title: "Ketepatan Waktu"
    description: "Penerbitan sertifikat maksimal 7 hari kerja setelah inspeksi"
    icon: "bi-clock"
    icon_color: "text-primary"

  - title: "After Sales Support"
    description: "Konsultasi dan pendampingan pasca inspeksi"
    icon: "bi-headset"
    icon_color: "text-success"

  - title: "Continuous Improvement"
    description: "Senantiasa meningkatkan kualitas layanan dan kompetensi tim"
    icon: "bi-graph-up-arrow"
    icon_color: "text-warning"
