# Detailed Services
services:
  # Pesawat Angkat & Angkut
  - category: "pesawat-angkat"
    name: "Crane"
    slug: "crane"
    description: "Inspeksi dan riksa uji crane (overhead crane, gantry crane, mobile crane)"
    certification_period: "1 tahun"
    regulations:
      - "Permenaker No. 8 Tahun 2020"
      - "SNI ISO 4301"
    requirements:
      - "Gambar teknis dan spesifikasi"
      - "Buku operasional"
      - "Sertifikat sebelumnya (jika ada)"

  - category: "pesawat-angkat"
    name: "Hoist"
    slug: "hoist"
    description: "Inspeksi dan riksa uji electric hoist dan chain block"
    certification_period: "1 tahun"
    regulations:
      - "Permenaker No. 8 Tahun 2020"
    requirements:
      - "Nameplate yang jelas"
      - "Manual operasional"

  - category: "pesawat-angkat"
    name: "Lift / Elevator"
    slug: "lift"
    description: "Inspeksi dan riksa uji lift penumpang dan barang"
    certification_period: "1 tahun"
    regulations:
      - "Permenaker No. 8 Tahun 2020"
      - "SNI 03-7011-2012"
    requirements:
      - "Gambar instalasi lift"
      - "Sertifikat komponen utama"
      - "Buku pemeliharaan"

  - category: "pesawat-angkat"
    name: "Forklift"
    slug: "forklift"
    description: "Inspeksi dan riksa uji forklift (diesel, electric, LPG)"
    certification_period: "1 tahun"
    regulations:
      - "Permenaker No. 8 Tahun 2020"
    requirements:
      - "STNK dan BPKB"
      - "Manual operasional"

  - category: "pesawat-angkat"
    name: "Gondola"
    slug: "gondola"
    description: "Inspeksi dan riksa uji gondola / building maintenance unit"
    certification_period: "1 tahun"
    regulations:
      - "Permenaker No. 8 Tahun 2020"
    requirements:
      - "Gambar instalasi"
      - "Sertifikat wire rope"

  # Pesawat Uap & Bejana Tekan
