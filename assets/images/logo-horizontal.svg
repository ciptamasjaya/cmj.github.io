<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield Icon -->
  <path d="M20 10 L35 15 L35 30 Q35 40 20 45 Q5 40 5 30 L5 15 Z"
        fill="#0d6efd"
        stroke="#084298"
        stroke-width="1"/>

  <!-- Inner Shield Gradient -->
  <path d="M20 13 L32 17 L32 30 Q32 37 20 41 Q8 37 8 30 L8 17 Z"
        fill="url(#shieldGradHorizontal)"
        opacity="0.9"/>

  <!-- Checkmark in Shield -->
  <path d="M14 27 L18 31 L26 21"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Company Name -->
  <text x="45" y="25"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#8B4513">PT. Cipta Mas Jaya</text>

  <!-- Tagline -->
  <text x="45" y="42"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="500"
        fill="#6c757d">Jasa Riksa Uji K3 Terpercaya</text>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="shieldGradHorizontal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#084298;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
