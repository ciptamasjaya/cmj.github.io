<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>

  <!-- Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004c99;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Icon - Safety Shield -->
  <circle cx="400" cy="250" r="120" fill="url(#grad1)" opacity="0.1"/>
  <path d="M 400 150 L 480 180 L 480 280 Q 480 340 400 370 Q 320 340 320 280 L 320 180 Z"
        fill="url(#grad1)" stroke="#003d7a" stroke-width="3"/>

  <!-- Checkmark -->
  <path d="M 360 250 L 385 280 L 450 210"
        fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="bold"
        fill="#333" text-anchor="middle">Riksa Uji K3</text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="20"
        fill="#666" text-anchor="middle">PT. Cipta Mas Jaya</text>
</svg>
