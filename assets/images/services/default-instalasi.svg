<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>

  <!-- Lightning Bolt Icon -->
  <g transform="translate(600, 315)">
    <!-- Circle background -->
    <circle cx="0" cy="0" r="180" fill="#0d6efd" opacity="0.1"/>

    <!-- Lightning bolt -->
    <path d="M40 -140 L-20 -20 L30 -20 L-40 140 L100 -40 L40 -40 Z"
          fill="#ffc107"/>
    <path d="M40 -140 L-20 -20 L30 -20 L-40 140 L100 -40 L40 -40 Z"
          stroke="#0d6efd" stroke-width="6" fill="none"/>

    <!-- Electrical symbols - circles at corners -->
    <circle cx="-120" cy="-120" r="15" fill="#0d6efd"/>
    <circle cx="120" cy="-120" r="15" fill="#0d6efd"/>
    <circle cx="-120" cy="120" r="15" fill="#0d6efd"/>
    <circle cx="120" cy="120" r="15" fill="#0d6efd"/>

    <!-- Connecting lines -->
    <line x1="-105" y1="-105" x2="105" y2="-105" stroke="#0d6efd" stroke-width="3" opacity="0.3"/>
    <line x1="-105" y1="105" x2="105" y2="105" stroke="#0d6efd" stroke-width="3" opacity="0.3"/>
    <line x1="-105" y1="-105" x2="-105" y2="105" stroke="#0d6efd" stroke-width="3" opacity="0.3"/>
    <line x1="105" y1="-105" x2="105" y2="105" stroke="#0d6efd" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="600"
        fill="#6c757d" text-anchor="middle">Riksa Uji Instalasi Listrik &amp; Petir</text>
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="24"
        fill="#adb5bd" text-anchor="middle">PT. Cipta Mas Jaya</text>
</svg>
