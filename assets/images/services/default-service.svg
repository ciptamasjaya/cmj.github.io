<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>

  <!-- Shield Icon -->
  <g transform="translate(600, 315)">
    <!-- Shield outline -->
    <path d="M0 -150 L100 -100 L100 50 Q100 100 75 125 Q50 150 0 180 Q-50 150 -75 125 Q-100 100 -100 50 L-100 -100 Z"
          fill="#0d6efd" opacity="0.1"/>
    <path d="M0 -150 L100 -100 L100 50 Q100 100 75 125 Q50 150 0 180 Q-50 150 -75 125 Q-100 100 -100 50 L-100 -100 Z"
          stroke="#0d6efd" stroke-width="8" fill="none"/>

    <!-- K3 Text -->
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="72" font-weight="bold"
          fill="#0d6efd" text-anchor="middle">K3</text>

    <!-- Checkmark -->
    <path d="M-30 -40 L-10 -20 L30 -80"
          stroke="#0d6efd" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Text -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="600"
        fill="#6c757d" text-anchor="middle">Layanan Riksa Uji K3</text>
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="24"
        fill="#adb5bd" text-anchor="middle">PT. Cipta Mas Jaya</text>
</svg>
