<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>

  <!-- Pressure Vessel Icon -->
  <g transform="translate(600, 315)">
    <!-- Main vessel body -->
    <ellipse cx="0" cy="-80" rx="100" ry="30" fill="#0d6efd" opacity="0.2"/>
    <rect x="-100" y="-80" width="200" height="200" fill="#0d6efd" opacity="0.2"/>
    <ellipse cx="0" cy="120" rx="100" ry="30" fill="#0d6efd" opacity="0.3"/>

    <!-- Vessel outline -->
    <path d="M-100 -80 L-100 120 Q-100 150 -70 150 L70 150 Q100 150 100 120 L100 -80"
          stroke="#0d6efd" stroke-width="8" fill="none"/>
    <ellipse cx="0" cy="-80" rx="100" ry="30" stroke="#0d6efd" stroke-width="8" fill="none"/>

    <!-- Pressure gauge on top -->
    <circle cx="0" cy="-120" r="30" fill="#fff" stroke="#0d6efd" stroke-width="6"/>
    <circle cx="0" cy="-120" r="20" fill="none" stroke="#0d6efd" stroke-width="3"/>
    <line x1="0" y1="-120" x2="12" y2="-130" stroke="#dc3545" stroke-width="4" stroke-linecap="round"/>

    <!-- Pipe connections -->
    <rect x="100" y="-20" width="60" height="20" fill="#6c757d"/>
    <rect x="-160" y="30" width="60" height="20" fill="#6c757d"/>

    <!-- Horizontal bands (reinforcement) -->
    <rect x="-100" y="-40" width="200" height="8" fill="#0d6efd"/>
    <rect x="-100" y="20" width="200" height="8" fill="#0d6efd"/>
    <rect x="-100" y="80" width="200" height="8" fill="#0d6efd"/>

    <!-- Pressure indicator arrows -->
    <path d="M-120 -10 L-140 0 L-120 10" fill="#dc3545" opacity="0.5"/>
    <path d="M120 -10 L140 0 L120 10" fill="#dc3545" opacity="0.5"/>
    <path d="M-120 50 L-140 60 L-120 70" fill="#dc3545" opacity="0.5"/>
    <path d="M120 50 L140 60 L120 70" fill="#dc3545" opacity="0.5"/>
  </g>

  <!-- Background circle -->
  <circle cx="600" cy="315" r="220" fill="#0d6efd" opacity="0.05"/>

  <!-- Text -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="600"
        fill="#6c757d" text-anchor="middle">Riksa Uji Pesawat Uap &amp; Bejana Tekan</text>
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="24"
        fill="#adb5bd" text-anchor="middle">PT. Cipta Mas Jaya</text>
</svg>
