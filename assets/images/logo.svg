<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0d6efd" opacity="0.1"/>

  <!-- Shield Shape -->
  <path d="M100 30 L150 50 L150 100 Q150 140 100 160 Q50 140 50 100 L50 50 Z"
        fill="#0d6efd"
        stroke="#084298"
        stroke-width="2"/>

  <!-- Inner Shield Highlight -->
  <path d="M100 40 L140 55 L140 100 Q140 130 100 145 Q60 130 60 100 L60 55 Z"
        fill="url(#shieldGradient)"
        opacity="0.9"/>

  <!-- Checkmark Symbol -->
  <path d="M75 95 L90 110 L125 70"
        stroke="#ffffff"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- K3 Text -->
  <text x="100" y="140"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#8B4513"
        text-anchor="middle">K3</text>

  <!-- CMJ Text (smaller) -->
  <text x="100" y="160"
        font-family="Arial, sans-serif"
        font-size="12"
        font-weight="600"
        fill="#6c757d"
        text-anchor="middle">PT. Cipta Mas Jaya</text>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#084298;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
