name: Rotate Frontmatter

on:
  schedule:
    # Run daily at random time (2-5 AM UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        required: false
        default: 'false'
        type: boolean

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Run rotation script
        id: rotate
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ruby scripts/rotate-frontmatter.rb --dry-run --verbose
          else
            ruby scripts/rotate-frontmatter.rb --verbose
          fi

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: rotate frontmatter for content freshness

          🤖 Auto-generated by GitHub Actions"
          git push
