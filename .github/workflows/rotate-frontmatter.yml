name: Content Freshness Robot

on:
  schedule:
    # Run daily at 3 AM UTC (10 AM WIB)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        required: false
        default: 'false'
        type: boolean
      robot:
        description: 'Specific robot to run (leave empty for random)'
        required: false
        type: choice
        options:
          - random
          - measurement
          - synonym

jobs:
  run-robot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Run content freshness robot
        id: robot
        run: |
          if [ "${{ inputs.robot }}" = "measurement" ]; then
            echo "Running specific robot: measurement"
            SCRIPT="scripts/rotate-frontmatter.rb"
          elif [ "${{ inputs.robot }}" = "synonym" ]; then
            echo "Running specific robot: synonym"
            SCRIPT="scripts/rotate-synonyms.rb"
          else
            echo "Running random robot selector"
            SCRIPT="scripts/run-random-robot.rb"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ruby $SCRIPT --dry-run --verbose
          else
            ruby $SCRIPT --verbose
          fi

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: content freshness update

          🤖 Auto-generated by Content Freshness Robot"
          git push
